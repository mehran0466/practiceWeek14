name: wf-pr-validation
on:
  pull_request:
    branches:
      - develop
jobs:
  lint-build-job:
    runs-on: ubuntu-latest
    steps: 
      - name: checkout
        uses: actions/checkout@v4
      - name: linting
        run: |
          npx htmlhint "**/*.html"
          npx stylelint "**/*.css"
      - name: Build with Parcel
        run: | 
          npx parcel build "./src/index.html" --dist-dir "./dev" --public-url "./dev"